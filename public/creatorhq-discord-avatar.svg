<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="60%" stop-color="#090c12" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>

    <!-- Outer Circular Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Chrome Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Core Play Button Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Face Dark Glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2233" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Square Discord Canvas Backdrop -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Central Cyber Glow -->
  <circle cx="256" cy="240" r="160" fill="#0284c7" opacity="0.18" filter="url(#intenseGlow)" />

  <!-- Background Tech Grid Overlay -->
  <rect width="512" height="512" fill="url(#techGrid)" />

  <!-- Discord Circular Avatar Guide Rim (Circular Cutout Safe Area) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rimGrad)" stroke-width="4" stroke-opacity="0.6" filter="url(#cyanGlow)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Emblem Centerpiece Scaled -->
  <g transform="translate(256, 235) scale(6.2) translate(-24, -24)">
    <!-- Outer Hex Shield -->
    <path
      d="M24 4L39 12.6V35.4L24 44L9 35.4V12.6L24 4Z"
      fill="url(#glassGrad)"
      stroke="url(#shieldGrad)"
      stroke-width="2.2"
      stroke-linejoin="round"
      filter="url(#cyanGlow)"
    />

    <!-- Inner Hex Inset Line -->
    <path
      d="M24 7.5L36 14.4V33.6L24 40.5L12 33.6V14.4L24 7.5Z"
      fill="none"
      stroke="#38bdf8"
      stroke-width="0.8"
      stroke-opacity="0.4"
    />

    <!-- Dynamic Interlocking C-Prism -->
    <path
      d="M33 16.5C30.5 13.5 26.5 12 22 13C16.5 14.2 12.5 19 13 25C13.5 31 18.5 35.5 24.5 35C29 34.5 32.5 32 34 28.5L28.5 25.5C27.5 27.5 25.5 28.8 23 28.5C20 28.2 17.5 25.5 17.8 22.5C18.1 19.5 20.8 17.2 23.8 17.5C25.8 17.7 27.2 18.8 28.2 20.2L33 16.5Z"
      fill="url(#shieldGrad)"
      filter="url(#cyanGlow)"
    />

    <!-- Precision Core Play Symbol -->
    <path
      d="M22 19.5L30.5 24.5L22 29.5V19.5Z"
      fill="url(#coreGrad)"
      filter="url(#cyanGlow)"
    />
  </g>

  <!-- Brand Typography: CREATORHQ -->
  <text
    x="256"
    y="440"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="6"
    fill="#ffffff"
  >CREATOR<tspan fill="#38bdf8">HQ</tspan></text>

  <!-- Accent Subtext -->
  <text
    x="256"
    y="464"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="3"
    fill="#94a3b8"
  >VERIFIED CREATOR ECOSYSTEM</text>
</svg>
